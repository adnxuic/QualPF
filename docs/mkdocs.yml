site_name: QualPF Documentation
site_description: Qualitative X-ray Powder Diffraction Analysis Software
site_author: adnxuic
docs_dir: user
site_dir: site
use_directory_urls: false

theme:
  name: material
  logo: images/qualpf.png
  favicon: images/qualpf-favicon.png
  palette:
    - scheme: default
      primary: blue
      accent: light blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Installation:
    - Software Installation: installation.md
    - Database Installation: database-installation.md
  - Introduction:
    - Overview: introduction/index.md
    - Getting Started: introduction/getting-started.md
    - Settings and Workflow History: settings.md
    - Worked Procedure: introduction/examples.md
  - Data Reduction:
    - Overview: data-reduction/index.md
    - Background: data-reduction/background.md
    - Initial Peak Search: data-reduction/initial-peak-search.md
    - Peak Search: data-reduction/peak-search.md
    - Smoothing: data-reduction/smoothing.md
    - K-α2 Stripping: data-reduction/kalpha2-stripping.md
  - Search & Match:
    - Overview: search-match/index.md
    - Search Match: search-match/search-match.md
    - Restraints: search-match/restraints.md
  - References: references.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

extra:
  generator: false
